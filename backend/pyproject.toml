[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dm-checker"
version = "0.1.0"
description = "Async backend service for bulk DM availability checks"
authors = [{name = "AutoGenerated"}]
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27.0",
    "sqlmodel>=0.0.14",
    "alembic>=1.13.1",
    "pydantic-settings>=2.0.3",
    "typer[all]>=0.9.0",
    "aiofiles>=23.2.1",
    "rich>=13.7.0",
    "asyncio-throttle>=1.0.2",
    "tenacity>=8.2.3",
    "uvicorn>=0.30.1",
    "fastapi>=0.111.0"
]

[tool.setuptools.packages.find]
where = ["src"]
